# Publishes the repository root to GitHub Pages on every push to main.
# The app is static (no build step), so the artifact is the checkout itself.
#
# One-time setup (GITHUB_TOKEN cannot switch Pages on by itself):
#   repository Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# Until that is set, the deploy job fails with "Get Pages site failed".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
